<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب العمر | أدواتي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>حساب العمر</h1>
  <p>احسب عمرك بسهولة</p>
</header>

<main>
  <label for="birthdate">تاريخ الميلاد:</label>
  <input type="date" id="birthdate">

  <button onclick="calculateAge()">احسب العمر</button>

  <h2 id="result"></h2>

  <a href="index.html">العودة إلى أدواتي</a>
</main>

<script>
function calculateAge() {
  const birthdate = new Date(document.getElementById("birthdate").value);
  const today = new Date();

  if (isNaN(birthdate.getTime())) {
    document.getElementById("result").textContent = "يرجى اختيار تاريخ الميلاد";
    return;
  }

  let years = today.getFullYear() - birthdate.getFullYear();
  let months = today.getMonth() - birthdate.getMonth();
  let days = today.getDate() - birthdate.getDate();

  if (days < 0) {
    months--;
    const previousMonth = new Date(today.getFullYear(), today.getMonth(), 0);
    days += previousMonth.getDate();
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  document.getElementById("result").textContent =
    "عمرك: " + years + " سنة و" + months + " شهر و" + days + " يوم";
}
</script>

</body>
</html>
