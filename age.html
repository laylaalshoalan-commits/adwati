<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة العمر | أدواتي</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="wrap tool"><div class="box"><a class="logo" href="../index.html">أدواتي</a><h1>حاسبة العمر</h1><label>تاريخ الميلاد</label><input id="d" type="date"><button onclick="go()">احسب</button><div id="r" class="result"></div></div></main><script>function go(){let b=new Date(d.value+'T00:00:00'),n=new Date(),y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),day=n.getDate()-b.getDate();if(day<0){m--;day+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}r.textContent=`عمرك: ${y} سنة و${m} شهر و${day} يوم`}</script></body></html>
