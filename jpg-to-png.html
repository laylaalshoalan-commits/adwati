<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحويل JPG إلى PNG | أدواتي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>تحويل JPG إلى PNG</h1>
  <p>حوّل صور JPG إلى PNG مباشرة من المتصفح</p>
</header>

<main>
  <input type="file" id="imageInput" accept=".jpg,.jpeg,image/jpeg">

  <button onclick="convertImage()">تحويل إلى PNG</button>

  <p id="result"></p>

  <a id="download" style="display:none;" download="converted-image.png">
    تحميل صورة PNG
  </a>

  <br><br>
  <a href="index.html">العودة إلى أدواتي</a>
</main>

<script>
function convertImage() {
  const input = document.getElementById("imageInput");
  const result = document.getElementById("result");
  const download = document.getElementById("download");

  if (!input.files[0]) {
    result.textContent = "يرجى اختيار صورة JPG أولًا";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    const image = new Image();

    image.onload = function() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = image.width;
      canvas.height = image.height;

      ctx.drawImage(image, 0, 0);

      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);

        download.href = url;
        download.style.display = "inline-block";
        download.textContent = "تحميل صورة PNG";

        result.textContent = "تم تحويل الصورة بنجاح";
      }, "image/png");
    };

    image.src = event.target.result;
  };

  reader.readAsDataURL(input.files[0]);
}
</script>

</body>
</html>
