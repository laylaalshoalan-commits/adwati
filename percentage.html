<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة النسبة المئوية | أدواتي</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="wrap tool"><div class="box"><a class="logo" href="../index.html">أدواتي</a><h1>حاسبة النسبة المئوية</h1><div class="row"><div><label>النسبة %</label><input id="p" type="number" value="20"></div><div><label>العدد</label><input id="n" type="number" value="500"></div></div><button onclick="calc()">احسب</button><div id="r" class="result"></div></div></main><script>function calc(){r.innerHTML='<b>'+((+p.value*+n.value)/100).toLocaleString('ar')+'</b>'}</script></body></html>
