<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ضغط الصور | أدواتي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>ضغط الصور</h1>
  <p>قلّل حجم الصورة بسهولة من المتصفح</p>
</header>

<main>
  <input type="file" id="imageInput" accept="image/*">

  <label for="quality">جودة الصورة:</label>
  <input type="range" id="quality" min="10" max="100" value="70">

  <span id="qualityValue">70%</span>

  <button onclick="compressImage()">ضغط الصورة</button>

  <p id="result"></p>

  <a id="download" style="display:none;" download="compressed-image.jpg">
    تحميل الصورة المضغوطة
  </a>

  <br><br>
  <a href="index.html">العودة إلى أدواتي</a>
</main>

<script>
const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");

quality.addEventListener("input", function () {
  qualityValue.textContent = this.value + "%";
});

function compressImage() {
  const input = document.getElementById("imageInput");
  const result = document.getElementById("result");
  const download = document.getElementById("download");

  if (!input.files || !input.files[0]) {
    result.textContent = "يرجى اختيار صورة أولًا";
    return;
  }

  const file = input.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    const image = new Image();

    image.onload = function() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = image.width;
      canvas.height = image.height;

      ctx.drawImage(image, 0, 0);

      canvas.toBlob(
        function(blob) {
          const url = URL.createObjectURL(blob);

          download.href = url;
          download.style.display = "inline-block";
          download.textContent = "تحميل الصورة المضغوطة";

          result.textContent =
            "تم ضغط الصورة. الحجم الجديد: " +
            Math.round(blob.size / 1024) + " KB";
        },
        "image/jpeg",
        quality.value / 100
      );
    };

    image.src = event.target.result;
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
