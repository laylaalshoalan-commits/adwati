<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أداة صور | أدواتي</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="wrap tool"><div class="box"><a class="logo" href="../index.html">أدواتي</a><h1 id="title">أداة الصور</h1><input id="f" type="file" accept="image/*"><label>الجودة</label><input id="q" type="range" min=".2" max="1" step=".05" value=".85"><button onclick="go()">تنفيذ</button><div id="r" class="result"></div></div></main><script>let mode=location.pathname.includes('compress')?'compress':location.pathname.includes('resize')?'resize':location.pathname.includes('png-to-jpg')?'pngjpg':'jpgpng';let im=new Image();f.onchange=()=>{im.onload=()=>{};im.src=URL.createObjectURL(f.files[0])};title.textContent=mode==='compress'?'ضغط الصور':mode==='resize'?'تغيير حجم الصور':mode==='pngjpg'?'PNG إلى JPG':'JPG إلى PNG';function go(){if(!f.files[0])return;r.textContent='جاري المعالجة...';im.onload=()=>{let c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);let type=mode==='jpgpng'?'image/png':'image/jpeg';c.toBlob(b=>{let u=URL.createObjectURL(b);r.innerHTML=`تمت المعالجة — <a class="download" download="adawati-image.${type==='image/png'?'png':'jpg'}" href="${u}">تحميل الملف</a>`},type,+q.value)};im.src=URL.createObjectURL(f.files[0])}</script></body></html>
