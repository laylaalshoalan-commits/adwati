<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولد QR Code | أدواتي</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="wrap tool"><div class="box"><a class="logo" href="../index.html">أدواتي</a><h1>مولد QR Code</h1><input id="t" placeholder="رابط أو نص"><button onclick="go()">إنشاء</button><div id="q" class="result"></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>function go(){q.innerHTML='';new QRCode(q,{text:t.value,width:220,height:220})}</script></body></html>
