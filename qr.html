<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء QR Code | أدواتي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>إنشاء QR Code</h1>
  <p>حوّل النص أو الرابط إلى رمز QR</p>
</header>

<main>
  <label for="text">النص أو الرابط:</label>
  <input type="text" id="text" placeholder="اكتب النص أو الرابط">

  <button onclick="generateQR()">إنشاء QR Code</button>

  <div id="qrcode"></div>

  <p id="result"></p>

  <a href="index.html">العودة إلى أدواتي</a>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function generateQR() {
  const text = document.getElementById("text").value.trim();
  const qr = document.getElementById("qrcode");
  const result = document.getElementById("result");

  qr.innerHTML = "";

  if (!text) {
    result.textContent = "يرجى إدخال نص أو رابط أولًا";
    return;
  }

  new QRCode(qr, {
    text: text,
    width: 200,
    height: 200
  });

  result.textContent = "تم إنشاء رمز QR بنجاح";
}
</script>

</body>
</html>
