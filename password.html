<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد كلمات المرور | أدواتي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>مولد كلمات المرور</h1>
  <p>أنشئ كلمة مرور قوية وعشوائية</p>
</header>

<main>
  <label for="length">طول كلمة المرور:</label>
  <input type="number" id="length" value="12" min="4" max="50">

  <button onclick="generatePassword()">إنشاء كلمة المرور</button>

  <input type="text" id="password" readonly>

  <button onclick="copyPassword()">نسخ كلمة المرور</button>

  <p id="message"></p>

  <a href="index.html">العودة إلى أدواتي</a>
</main>

<script>
function generatePassword() {
  const length = parseInt(document.getElementById("length").value);

  if (length < 4 || length > 50) {
    document.getElementById("message").textContent =
      "اختر طولًا بين 4 و50";
    return;
  }

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

  let password = "";

  for (let i = 0; i < length; i++) {
    password += characters.charAt(
      Math.floor(Math.random() * characters.length)
    );
  }

  document.getElementById("password").value = password;
  document.getElementById("message").textContent = "";
}

function copyPassword() {
  const password = document.getElementById("password");

  if (!password.value) {
    document.getElementById("message").textContent =
      "أنشئ كلمة المرور أولًا";
    return;
  }

  navigator.clipboard.writeText(password.value);

  document.getElementById("message").textContent =
    "تم نسخ كلمة المرور";
}
</script>

</body>
</html>
