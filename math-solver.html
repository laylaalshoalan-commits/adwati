<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مساعد الرياضيات | أدواتي</title>
<meta name="description" content="مساعد رياضيات عربي مجاني يشرح حل المعادلات والكسور والنسب والقوى خطوة بخطوة بطريقة تعليمية سهلة للطلاب.">
<meta name="theme-color" content="#0f766e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f766e;
  --primary-dark:#115e59;
  --primary-light:#ccfbf1;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --success:#15803d;
  --success-bg:#f0fdf4;
  --warning:#b45309;
  --warning-bg:#fffbeb;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Tajawal",sans-serif;
  line-height:1.8;
}

.container{
  width:min(1050px,calc(100% - 28px));
  margin:auto;
}

/* Header */
header{
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(10px);
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:var(--primary);
  text-decoration:none;
  font-size:23px;
  font-weight:800;
}

.back{
  color:var(--muted);
  text-decoration:none;
  font-weight:600;
}

.back:hover{
  color:var(--primary);
}

/* Hero */
.hero{
  padding:38px 0 25px;
  text-align:center;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--primary-light);
  color:var(--primary-dark);
  padding:5px 13px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
}

.hero h1{
  margin:12px 0 8px;
  font-size:clamp(28px,6vw,45px);
  line-height:1.25;
}

.hero p{
  color:var(--muted);
  max-width:680px;
  margin:0 auto;
}

/* Main card */
.workspace{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-weight:700;
}

select,
input,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:13px;
  padding:13px 14px;
  font-family:inherit;
  font-size:16px;
  background:#fff;
  color:var(--text);
  outline:none;
  transition:.2s;
}

textarea{
  min-height:125px;
  resize:vertical;
  line-height:2;
}

select:focus,
input:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(15,118,110,.10);
}

/* Keyboard */
.keyboard-title{
  margin:18px 0 8px;
  font-weight:800;
}

.keyboard{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.key{
  border:1px solid var(--border);
  background:#f8fafc;
  color:var(--text);
  border-radius:10px;
  padding:8px 13px;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
  font-size:15px;
}

.key:hover{
  background:var(--primary-light);
  border-color:#99f6e4;
}

/* Buttons */
.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  font-family:inherit;
}

.btn{
  border:0;
  border-radius:13px;
  padding:13px 20px;
  cursor:pointer;
  font-size:16px;
  font-weight:800;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  flex:1;
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.btn-secondary{
  background:#f1f5f9;
  color:#334155;
}

/* Examples */
.examples{
  margin-top:20px;
}

.examples h3{
  margin:0 0 8px;
  font-size:17px;
}

.example-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.example{
  border:1px solid var(--border);
  background:#fff;
  color:var(--primary-dark);
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
}

/* Solution */
.result{
  display:none;
  margin-top:24px;
}

.solution-panel{
  border:2px solid #99f6e4;
  border-radius:22px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 12px 35px rgba(15,118,110,.09);
}

.solution-head{
  background:linear-gradient(135deg,#ecfeff,#f0fdfa);
  padding:18px 20px;
  border-bottom:1px solid #ccfbf1;
}

.teacher-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:21px;
  font-weight:800;
  color:var(--primary-dark);
}

.lesson-label{
  color:var(--muted);
  margin-top:2px;
  font-size:14px;
}

.solution-body{
  padding:20px;
}

/* Problem */
.problem-box{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px 16px;
  margin-bottom:18px;
}

.box-title{
  color:var(--muted);
  font-size:14px;
  font-weight:700;
  margin-bottom:5px;
}

.math{
  direction:ltr;
  text-align:center;
  font-family:"Cambria","Times New Roman",serif;
  font-size:23px;
  font-weight:700;
  color:#111827;
  letter-spacing:.2px;
}

.step{
  display:grid;
  grid-template-columns:40px 1fr;
  gap:12px;
  padding:17px 0;
  border-bottom:1px dashed #cbd5e1;
}

.step:last-child{
  border-bottom:0;
}

.step-number{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.step-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:4px;
}

.teacher-note{
  color:#475569;
  font-size:15px;
  margin-top:5px;
}

.rule{
  margin-top:16px;
  padding:15px;
  border-radius:15px;
  background:#fffbeb;
  border:1px solid #fde68a;
}

.rule-title{
  color:var(--warning);
  font-weight:800;
  margin-bottom:4px;
}

.check{
  margin-top:16px;
  padding:15px;
  border-radius:15px;
  background:var(--success-bg);
  border:1px solid #bbf7d0;
}

.check-title{
  color:var(--success);
  font-weight:800;
  margin-bottom:4px;
}

.final{
  margin-top:18px;
  background:var(--primary);
  color:white;
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.final-label{
  font-size:14px;
  opacity:.9;
}

.final-answer{
  direction:ltr;
  font-family:"Cambria","Times New Roman",serif;
  font-size:30px;
  font-weight:800;
  margin-top:2px;
}

/* Fraction */
.frac{
  display:inline-flex;
  flex-direction:column;
  vertical-align:middle;
  text-align:center;
  line-height:1.05;
  margin:0 3px;
  min-width:28px;
}

.frac .top{
  border-bottom:2px solid currentColor;
  padding:0 5px 2px;
}

.frac .bottom{
  padding:2px 5px 0;
}

/* Unsupported */
.notice{
  background:#fefce8;
  border:1px solid #fde68a;
  color:#854d0e;
  padding:15px;
  border-radius:14px;
  margin-top:15px;
}

/* Footer */
footer{
  text-align:center;
  color:var(--muted);
  padding:25px 10px 40px;
  font-size:14px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .workspace{
    padding:15px;
    border-radius:18px;
  }

  .actions{
    flex-direction:column;
  }

  .step{
    grid-template-columns:34px 1fr;
    gap:9px;
  }

  .step-number{
    width:32px;
    height:32px;
  }

  .math{
    font-size:20px;
  }

  .final-answer{
    font-size:26px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">
    <a class="logo" href="index.html">أدواتي</a>
    <a class="back" href="index.html">← العودة للأدوات</a>
  </div>
</header>

<main class="container">

<section class="hero">
  <span class="badge">🎓 أداة تعليمية مجانية</span>
  <h1>مساعد الرياضيات</h1>
  <p>
    اكتب المسألة كما هي في كتابك، وسأرتب لك الحل خطوة بخطوة

<section class="workspace">

        <option value="quadratic">المعادلات التربيعية</option>

      <label for="problem">اكتب المسألة</label>

    <button class="key" data-value="س">س</button>

    <button class="key" data-value="+">+</button>

    <button class="key" data-value="÷">÷</button>
    <button class="key" data-value="=">=</button>
    <button class="key" data-value="(">(</button>
    <button class="key" data-value=")">)</button>

  <div class="actions">

      <button class="example" data-example="س² - 5س + 6 = 0">س² - 5س + 6 = 0</button>
      <button class="example" data-example="3/4 + 1/2">3/4 + 1/2</button>
      <button class="example" data-example="20% من 150">20% من 150</button>
      <button class="example" data-example="√25 + 3²">√25 + 3²</button>

  <section class="result" id="result"></section>

</section>

</main>

<footer>
  أدواتي © جميع الحقوق محفوظة

<script>
"use strict";

/* =========================
   أدوات مساعدة
========================= */

const problemInput = document.getElementById("problem");
const lessonInput = document.getElementById("lesson");
const levelInput = document.getElementById("level");
const resultBox = document.getElementById("result");

function normalize(text){
  return text
    .trim()
    .replace(/[٠-٩]/g, d => "0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)])
    .replace(/٫/g, ".")
    .replace(/،/g, ",")
    .replace(/−/g, "-")
    .replace(/×/g, "*")
    .replace(/÷/g, "/")
    .replace(/٪/g, "%")
    .replace(/س/g, "x")
    .replace(/²/g, "^2")
    .replace(/³/g, "^3")
    .replace(/√/g, "sqrt");
}

function pretty(text){
  return text
    .replace(/x/g,"س")
    .replace(/\*/g," × ")
    .replace(/\//g," ÷ ")
    .replace(/\^2/g,"²")
    .replace(/\^3/g,"³")
    .replace(/sqrt/g,"√");
}

function gcd(a,b){
  a=Math.abs(a);
  b=Math.abs(b);
  while(b){
    let t=a%b;
    a=b;
    b=t;
  }
  return a || 1;
}

function fraction(n,d){
  if(d===0) return null;

  if(d<0){
    n=-n;
    d=-d;
  }

  const g=gcd(n,d);
  n/=g;
  d/=g;

  return {n,d};
}

function fractionHTML(n,d){
  const f=fraction(n,d);

  if(!f) return "غير معرّف";

  if(f.d===1) return String(f.n);

  return `
    <span class="frac">
      <span class="top">${f.n}</span>
      <span class="bottom">${f.d}</span>
    </span>
  `;
}

function decimalToFraction(value){
  const str=String(value);

  if(!str.includes(".")){
    return fraction(Number(str),1);
  }

  const decimals=str.split(".")[1].length;
  const denominator=10**decimals;
  const numerator=Math.round(value*denominator);

  return fraction(numerator,denominator);
}

function numberHTML(value){
  if(Number.isInteger(value)){
    return String(value);
  }

  return fractionHTML(
    decimalToFraction(value).n,
    decimalToFraction(value).d
  );
}

function niceNumber(value){
  if(Math.abs(value-Math.round(value))<1e-10){
    return String(Math.round(value));
  }

  return String(Number(value.toFixed(8)));
}

function escapeHTML(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* =========================
   بناء لوحة الأستاذ
========================= */

function startSolution(problem, lessonName){
  resultBox.style.display="block";

  resultBox.innerHTML=`
    <div class="solution-panel">

      <div class="solution-head">
        <div class="teacher-title">🧑‍🏫 شرح الأستاذ</div>
        <div class="lesson-label">${lessonName}</div>
      </div>

      <div class="solution-body">

        <div class="problem-box">
          <div class="box-title">المسألة</div>
          <div class="math">${pretty(escapeHTML(problem))}</div>
        </div>

        <div id="steps"></div>

        <div id="rule"></div>

        <div id="check"></div>

        <div id="final"></div>

      </div>
    </div>
  `;
}

function addStep(number,title,math,explanation){
  const steps=document.getElementById("steps");

  steps.insertAdjacentHTML("beforeend",`
    <div class="step">
      <div class="step-number">${number}</div>

      <div>
        <div class="step-title">${title}</div>
        <div class="math">${math}</div>
        <div class="teacher-note">
          💡 ${explanation}
        </div>
      </div>
    </div>
  `);
}

function addRule(title,text){
  document.getElementById("rule").innerHTML=`
    <div class="rule">
      <div class="rule-title">📌 ${title}</div>
      <div>${text}</div>
    </div>
  `;
}

function addCheck(text){
  document.getElementById("check").innerHTML=`
    <div class="check">
      <div class="check-title">🔎 التحقق من الحل</div>
      <div>${text}</div>
    </div>
  `;
}

function addFinal(answer){
  document.getElementById("final").innerHTML=`
    <div class="final">
      <div class="final-label">✅ النتيجة النهائية</div>
      <div class="final-answer">${answer}</div>
    </div>
  `;
}

function showNotice(message){
  resultBox.style.display="block";

  resultBox.innerHTML=`
    <div class="solution-panel">
      <div class="solution-head">
        <div class="teacher-title">🧑‍🏫 شرح الأستاذ</div>
      </div>

      <div class="solution-body">
        <div class="notice">
          ${message}
        </div>
      </div>
    </div>
  `;
}

/* =========================
   المعادلات الخطية
========================= */

function parseLinearSide(side){

  side=side.replace(/\s+/g,"");

  const terms=side.match(/[+-]?[^+-]+/g) || [];

  let x=0;
  let constant=0;

  for(let term of terms){

    if(!term) continue;

    if(term.includes("x")){

      let coefficient=term.replace("x","");

      if(coefficient==="+" || coefficient===""){
        coefficient="1";
      }

      if(coefficient==="-"){
        coefficient="-1";
      }

      x+=Number(coefficient);

    }else{
      constant+=Number(term);
    }
  }

  return {x,constant};
}

function solveLinear(raw){

  const parts=raw.split("=");

  if(parts.length!==2){
    showNotice("اكتب المعادلة بهذا الشكل مثل: <b>2س + 5 = 15</b>");
    return;
  }

  const left=parseLinearSide(parts[0]);
  const right=parseLinearSide(parts[1]);

  const a=left.x-right.x;
  const b=left.constant-right.constant;

  if(Math.abs(a)<1e-12){
    showNotice("هذه ليست معادلة خطية قابلة للحل بالطريقة المعتادة.");
    return;
  }

  const x=-b/a;

  startSolution(raw,"المعادلات الخطية");

  addStep(
    1,
    "نجمع الحدود المتشابهة",
    `${niceNumber(a)}س ${b>=0?"+":"−"} ${Math.abs(niceNumber(b))} = 0`,
    "نضع حدود س في جهة واحدة، والأعداد الثابتة في الجهة الأخرى."
  );

  addStep(
    2,
    "نعزل س",
    `س = ${niceNumber(x)}`,
    `نقسم الطرفين على معامل س (${niceNumber(a)}) حتى يبقى س وحده.`
  );

  addRule(
    "قاعدة المعادلة الخطية",
    "إذا كان لدينا <b>أ س + ب = 0</b>، فإن <b>س = −ب ÷ أ</b>."
  );

  const leftCheck=left.x*x+left.constant;
  const rightCheck=right.x*x+right.constant;

  addCheck(`
    بعد التعويض بالقيمة س = <b>${niceNumber(x)}</b>:
    الطرف الأيسر = <b>${niceNumber(leftCheck)}</b>
    والطرف الأيمن = <b>${niceNumber(rightCheck)}</b>.
    <br>
    وبما أن الطرفين متساويان، فالحل صحيح.
  `);

  addFinal(`س = ${niceNumber(x)}`);
}

/* =========================
   المعادلات التربيعية
========================= */

function parseQuadraticSide(side){

  side=side
    .replace(/\s+/g,"")
    .replace(/\*/g,"");

  const terms=side.match(/[+-]?[^+-]+/g) || [];

  let a=0,b=0,c=0;

  for(let term of terms){

    if(term.includes("x^2")){

      let value=term.replace("x^2","");

      if(value==="" || value==="+") value="1";
      if(value==="-") value="-1";

      a+=Number(value);

    }else if(term.includes("x")){

      let value=term.replace("x","");

      if(value==="" || value==="+") value="1";
      if(value==="-") value="-1";

      b+=Number(value);

    }else{

      c+=Number(term);
    }
  }

  return {a,b,c};
}

function perfectSquare(n){
  const r=Math.sqrt(n);
  return Math.abs(r-Math.round(r))<1e-10;
}

function solveQuadratic(raw){

  const parts=raw.split("=");

  if(parts.length!==2){
    showNotice("اكتب المعادلة التربيعية مثل: <b>س² - 5س + 6 = 0</b>");
    return;
  }

  const L=parseQuadraticSide(parts[0]);
  const R=parseQuadraticSide(parts[1]);

  const a=L.a-R.a;
  const b=L.b-R.b;
  const c=L.c-R.c;

  if(Math.abs(a)<1e-12){
    solveLinear(raw);
    return;
  }

  const delta=b*b-4*a*c;

  startSolution(raw,"المعادلات التربيعية");

  addStep(
    1,
    "نرتب المعادلة",
    `${niceNumber(a)}س² ${b>=0?"+":"−"} ${Math.abs(niceNumber(b))}س ${c>=0?"+":"−"} ${Math.abs(niceNumber(c))} = 0`,
    "نحوّل المعادلة إلى الصورة القياسية: أ س² + ب س + ج = 0."
  );

  addStep(
    2,
    "نحسب المميز Δ",
    `Δ = ب² − 4 × أ × ج = ${niceNumber(delta)}`,
    "المميز يساعدنا على معرفة عدد الحلول الحقيقية للمعادلة."
  );

  if(delta<0){

    addStep(
      3,
      "نفسر المميز",
      "Δ < 0",
      "عندما يكون المميز سالبًا، لا توجد حلول حقيقية."
    );

    addRule(
      "قاعدة المميز",
      "إذا كان Δ < 0 فلا توجد جذور حقيقية، وإذا كان Δ = 0 يوجد حل حقيقي واحد، وإذا كان Δ > 0 يوجد حلان حقيقيان."
    );

    addFinal("لا توجد حلول حقيقية");

    return;
  }

  if(delta===0){

    const x=-b/(2*a);

    addStep(
      3,
      "نطبق القانون",
      `س = −ب ÷ (2أ) = ${niceNumber(x)}`,
      "بما أن المميز يساوي صفرًا، فإن الجذرين متساويان."
    );

    addRule(
      "القانون العام",
      "س = (−ب ± √Δ) ÷ (2أ)"
    );

    addCheck(`
      عند التعويض بـ س = <b>${niceNumber(x)}</b>
      تصبح المعادلة مساوية للصفر.
    `);

    addFinal(`س = ${niceNumber(x)}`);

    return;
  }

  const sqrtDelta=Math.sqrt(delta);

  let x1=(-b+sqrtDelta)/(2*a);
  let x2=(-b-sqrtDelta)/(2*a);

  addStep(
    3,
    "نطبق القانون العام",
    `س = (−ب ± √Δ) ÷ (2أ)`,
    "نستخدم القانون العام للمعادلة التربيعية للحصول على الجذرين."
  );

  if(perfectSquare(delta)){

    addStep(
      4,
      "نبسط الجذر",
      `√${niceNumber(delta)} = ${niceNumber(sqrtDelta)}`,
      "لأن المميز مربع كامل، نستطيع تبسيط الجذر."
    );

  }else{

    addStep(
      4,
      "نحسب الجذرين",
      `س₁ ≈ ${niceNumber(x1)} ، س₂ ≈ ${niceNumber(x2)}`,
      "المميز ليس مربعًا كاملًا، لذلك نعرض القيم التقريبية للجذرين."
    );
  }

  addRule(
    "اختصار مهم",
    "القانون العام هو الطريقة العامة لحل أي معادلة تربيعية عندما تكون على الصورة أ س² + ب س + ج = 0."
  );

  const check1=a*x1*x1+b*x1+c;
  const check2=a*x2*x2+b*x2+c;

  addCheck(`
    عند التعويض بالجذر الأول تكون قيمة الطرف الأيسر ≈
    <b>${niceNumber(check1)}</b>.
    <br>
    وعند التعويض بالجذر الثاني تكون ≈
    <b>${niceNumber(check2)}</b>.
    <br>
    والقيمتان قريبتان جدًا من الصفر، إذن الحل صحيح.
  `);

  addFinal(`
    س₁ = ${niceNumber(x1)}
    <br>
    س₂ = ${niceNumber(x2)}
  `);
}

/* =========================
   الكسور
========================= */

function parseFractionValue(text){

  text=text.trim();

  if(text.includes("/")){

    const p=text.split("/");

    if(p.length===2){
      return fraction(Number(p[0]),Number(p[1]));
    }
  }

  const n=Number(text);

  if(!Number.isNaN(n)){
    return fraction(n,1);
  }

  return null;
}

function solveFraction(raw){

  let expression=raw
    .replace(/\s+/g,"")
    .replace(/×/g,"*")
    .replace(/÷/g,"/");

  let match=expression.match(/^(-?\d+(?:\/\d+)?)\+(-?\d+(?:\/\d+)?)$/);

  let operation="+";

  if(!match){
    match=expression.match(/^(-?\d+(?:\/\d+)?)-(-?\d+(?:\/\d+)?)$/);
    operation="-";
  }

  if(!match){
    match=expression.match(/^(-?\d+(?:\/\d+)?)\*(-?\d+(?:\/\d+)?)$/);
    operation="*";
  }

  if(!match){
    match=expression.match(/^(-?\d+(?:\/\d+)?)\/(-?\d+(?:\/\d+)?)$/);
    operation="/";
  }

  if(!match){
    showNotice("أستطيع حاليًا شرح العمليات الأساسية على الكسور مثل: <b>3/4 + 1/2</b> أو <b>3/4 × 2/3</b>.");
    return;
  }

  const f1=parseFractionValue(match[1]);
  const f2=parseFractionValue(match[2]);

  if(!f1 || !f2){
    showNotice("تأكد من كتابة الكسر بهذا الشكل: 3/4");
    return;
  }

  let result;

  startSolution(raw,"الكسور");

  if(operation==="+" || operation==="-"){

    const common=f1.d*f2.d;

    const n1=f1.n*f2.d;
    const n2=f2.n*f1.d;

    const finalN=operation==="+" ? n1+n2 : n1-n2;

    result=fraction(finalN,common);

    addStep(
      1,
      "نوحّد المقامات",
      `${fractionHTML(f1.n,f1.d)} ${operation} ${fractionHTML(f2.n,f2.d)}
       = 
       ${fractionHTML(n1,common)}
       ${operation}
       ${fractionHTML(n2,common)}`,
      "لا نستطيع جمع أو طرح الكسور مباشرة إلا بعد جعل المقامات متساوية."
    );

    addStep(
      2,
      "نجمع أو نطرح البسطين",
      `${fractionHTML(n1,common)} ${operation} ${fractionHTML(n2,common)}
       = ${fractionHTML(finalN,common)}`,
      "بعد توحيد المقامات، نجمع أو نطرح البسطين فقط، ونبقي المقام كما هو."
    );

  }else if(operation==="*"){

    result=fraction(
      f1.n*f2.n,
      f1.d*f2.d
    );

    addStep(
      1,
      "نضرب البسطين",
      `${fractionHTML(f1.n,f1.d)} × ${fractionHTML(f2.n,f2.d)}`,
      "في ضرب الكسور نضرب البسط في البسط."
    );

    addStep(
      2,
      "نضرب المقامين ونبسط",
      `= ${fractionHTML(f1.n*f2.n,f1.d*f2.d)}`,
      "نضرب المقام في المقام، ثم نختصر الكسر إذا كان ذلك ممكنًا."
    );

  }else{

    result=fraction(
      f1.n*f2.d,
      f1.d*f2.n
    );

    addStep(
      1,
      "نقلب الكسر الثاني",
      `${fractionHTML(f1.n,f1.d)} ÷ ${fractionHTML(f2.n,f2.d)}
       =
       ${fractionHTML(f1.n,f1.d)} × ${fractionHTML(f2.d,f2.n)}`,
      "قسمة كسر على كسر تعني ضرب الكسر الأول في مقلوب الكسر الثاني."
    );

    addStep(
      2,
      "نضرب ونبسط",
      `= ${fractionHTML(f1.n*f2.d,f1.d*f2.n)}`,
      "نضرب البسطين والمقامين ثم نبسط الناتج."
    );
  }

  addRule(
    "اختصارات مهمة في الكسور",
    "الجمع والطرح يحتاجان مقامًا مشتركًا. أما الضرب فنضرب البسطين والمقامين، وفي القسمة نقلب الكسر الثاني ثم نضرب."
  );

  addCheck("تم تبسيط الناتج إلى أبسط صورة ممكنة.");

  addFinal(fractionHTML(result.n,result.d));
}

/* =========================
   النسبة المئوية
========================= */

function solvePercentage(raw){

  const normalized=raw
    .replace(/\s+/g," ")
    .replace(/٪/g,"%");

  const match=normalized.match(/(\d+(?:\.\d+)?)\s*%\s*(?:من\s*)?(\d+(?:\.\d+)?)/);

  if(!match){
    showNotice("اكتب النسبة بهذا الشكل مثل: <b>20% من 150</b>");
    return;
  }

  const percent=Number(match[1]);
  const number=Number(match[2]);
  const result=percent/100*number;

  startSolution(raw,"النسبة المئوية");

  addStep(
    1,
    "نحوّل النسبة إلى كسر",
    `${percent}% = ${percent} ÷ 100`,
    "علامة % تعني أن العدد مقسوم على 100."
  );

  addStep(
    2,
    "نضرب في العدد",
    `(${percent} ÷ 100) × ${number}`,
    "لإيجاد نسبة من عدد، نضرب النسبة العشرية في العدد."
  );

  addStep(
    3,
    "نحسب الناتج",
    `= ${niceNumber(result)}`,
    "بعد إجراء العملية الحسابية نحصل على قيمة النسبة المطلوبة."
  );

  addRule(
    "قاعدة النسبة المئوية",
    "النسبة من عدد = (النسبة ÷ 100) × العدد."
  );

  addCheck(`
    ${percent}% من ${number} = <b>${niceNumber(result)}</b>.
  `);

  addFinal(niceNumber(result));
}

/* =========================
   القوى والجذور
========================= */

function solvePower(raw){

  let expression=normalize(raw).replace(/\s+/g,"");

  const rootMatch=expression.match(/^sqrt(\d+(?:\.\d+)?)$/);

  if(rootMatch){

    const n=Number(rootMatch[1]);
    const result=Math.sqrt(n);

    startSolution(raw,"الجذور");

    addStep(
      1,
      "نحدد العدد تحت الجذر",
      `√${n}`,
      "نبحث عن العدد الذي إذا ضربناه في نفسه يعطينا العدد الموجود تحت الجذر."
    );

    addStep(
      2,
      "نحسب الجذر",
      `√${n} = ${niceNumber(result)}`,
      "القيمة الناتجة هي العدد الذي مربعه يساوي العدد الأصلي."
    );

    addRule(
      "قاعدة الجذر التربيعي",
      "√أ هو العدد الذي إذا ضربناه في نفسه يعطينا أ."
    );

    addCheck(`
      ${niceNumber(result)} × ${niceNumber(result)}
      = ${niceNumber(result*result)}
    `);

    addFinal(`√${n} = ${niceNumber(result)}`);

    return;
  }

  const powerMatch=expression.match(/^(\d+(?:\.\d+)?)\^(\d+)$/);

  if(powerMatch){

    const base=Number(powerMatch[1]);
    const exponent=Number(powerMatch[2]);
    const result=Math.pow(base,exponent);

    startSolution(raw,"القوى");

    addStep(
      1,
      "نفسر الأس",
      `${base}<sup>${exponent}</sup>`,
      `الأس ${exponent} يعني تكرار ضرب العدد ${base} في نفسه ${exponent} مرات.`
    );

    addStep(
      2,
      "نكتب الضرب",
      Array(exponent).fill(base).join(" × "),
      "نحوّل القوة إلى عملية ضرب متكررة."
    );

    addStep(
      3,
      "نحسب الناتج",
      `= ${niceNumber(result)}`,
      "بعد إجراء عمليات الضرب نحصل على الناتج النهائي."
    );

    addRule(
      "قاعدة القوى",
      "أⁿ تعني ضرب أ في نفسه ن مرات."
    );

    addCheck(`
      ${niceNumber(result)} هو ناتج ${base}<sup>${exponent}</sup>.
    `);

    addFinal(`${base}<sup>${exponent}</sup> = ${niceNumber(result)}`);

    return;
  }

  showNotice("أستطيع حاليًا شرح أمثلة مثل <b>3²</b> و <b>2³</b> و <b>√25</b>.");
}

/* =========================
   تحديد نوع المسألة
========================= */

function detectLesson(raw){

  const selected=lessonInput.value;

  if(selected!=="auto"){
    return selected;
  }

  const n=normalize(raw);

  if(n.includes("%")){
    return "percentage";
  }

  if(n.includes("/")){
    return "fraction";
  }

  if(n.includes("^2") || n.includes("x^2")){
    return "quadratic";
  }

  if(n.includes("sqrt")){
    return "power";
  }

  if(n.includes("x") && n.includes("=")){
    return "linear";
  }

  if(/[س]/.test(raw) && raw.includes("=")){
    return "linear";
  }

  if(/\d+\^\d+/.test(n)){
    return "power";
  }

  return "unknown";
}

/* =========================
   تشغيل الحل
========================= */

function solve(){

  const raw=problemInput.value.trim();

  if(!raw){
    showNotice("اكتب المسألة أولًا، ثم اضغط «اشرح لي الحل».");
    return;
  }

  const type=detectLesson(raw);

  switch(type){

    case "linear":
      solveLinear(normalize(raw));
      break;

    case "quadratic":
      solveQuadratic(normalize(raw));
      break;

    case "fraction":
      solveFraction(raw);
      break;

    case "percentage":
      solvePercentage(raw);
      break;

    case "power":
      solvePower(raw);
      break;

    default:
      showNotice(`
        لم أتعرف على نوع المسألة بشكل مؤكد.
        <br><br>
        حتى لا أعطيك إجابة غير صحيحة، اكتب المسألة بصيغة أوضح، مثل:
        <br>
        <b>2س + 5 = 15</b>
        <br>
        أو
        <b>س² - 5س + 6 = 0</b>
        <br>
        أو
        <b>3/4 + 1/2</b>.
      `);
  }

  resultBox.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

/* =========================
   الأحداث
========================= */

document.getElementById("solveBtn")
  .addEventListener("click",solve);

document.getElementById("clearBtn")
  .addEventListener("click",()=>{

    problemInput.value="";
    resultBox.style.display="none";
    resultBox.innerHTML="";
    problemInput.focus();

  });

document.querySelectorAll(".key").forEach(button=>{

  button.addEventListener("click",()=>{

    const value=button.dataset.value;
    const start=problemInput.selectionStart;
    const end=problemInput.selectionEnd;

    problemInput.value=
      problemInput.value.slice(0,start)
      +value
      +problemInput.value.slice(end);

    problemInput.focus();

    const position=start+value.length;

    problemInput.setSelectionRange(position,position);
  });

});

document.querySelectorAll(".example").forEach(button=>{

  button.addEventListener("click",()=>{

    problemInput.value=button.dataset.example;

    const example=button.dataset.example;

    if(example.includes("س²")){
      lessonInput.value="quadratic";
    }else if(example.includes("/")){
      lessonInput.value="fraction";
    }else if(example.includes("%")){
      lessonInput.value="percentage";
    }else if(example.includes("√") || example.includes("²")){
      lessonInput.value="power";
    }else{
      lessonInput.value="linear";
    }

    problemInput.focus();
  });

});

problemInput.addEventListener("keydown",event=>{

  if(event.ctrlKey && event.key==="Enter"){
    solve();
  }

});
</script>
