<style>

:root{
    --primary:#0f766e;
    --primary-dark:#115e59;
    --primary-light:#ecfeff;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --success:#15803d;
    --success-bg:#f0fdf4;
    --danger:#dc2626;
    --danger-bg:#fef2f2;
    --shadow:0 10px 30px rgba(15,23,42,.07);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    line-height:1.8;
}

body.dark{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --muted:#94a3b8;
    --line:#1e293b;
    --primary-light:#134e4a;
    --success-bg:#052e16;
    --danger-bg:#450a0a;
}

.page{
    width:min(950px,calc(100% - 28px));
    margin:auto;
    padding:18px 0 50px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--text);
    font-weight:800;
}

.brand-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:var(--primary-light);
    color:var(--primary);
    font-size:23px;
}

.back-btn,
.theme-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    padding:9px 13px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
}

.back-btn:hover,
.theme-btn:hover{
    border-color:var(--primary);
    color:var(--primary);
}

.hero{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:21px;
    box-shadow:var(--shadow);
    padding:25px 20px;
    text-align:center;
    margin-bottom:16px;
}

.hero-icon{
    width:65px;
    height:65px;
    margin:0 auto 12px;
    border-radius:18px;
    background:var(--primary-light);
    color:var(--primary);
    display:grid;
    place-items:center;
    font-size:31px;
}

.hero h1{
    margin:0 0 6px;
    font-size:27px;
    font-weight:800;
}

.hero p{
    margin:0;
    color:var(--muted);
    font-size:14px;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:21px;
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:16px;
}

.card-title{
    display:flex;
    align-items:center;
    gap:9px;
    margin:0 0 16px;
    font-size:18px;
    font-weight:800;
}

.card-title span{
    color:var(--primary);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-weight:700;
    font-size:14px;
}

select,
input,
textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    padding:12px 13px;
    font-family:inherit;
    font-size:15px;
    outline:none;
}

select:focus,
input:focus,
textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(15,118,110,.10);
}

textarea{
    min-height:120px;
    resize:vertical;
    direction:ltr;
    text-align:left;
    font-size:20px;
    line-height:1.8;
}

.hint{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
}

.keyboard{
    margin-top:16px;
    padding:13px;
    background:var(--primary-light);
    border-radius:16px;
    border:1px solid rgba(15,118,110,.12);
}

.keyboard-title{
    font-weight:800;
    color:var(--primary);
    margin-bottom:10px;
}

.keys{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:7px;
    direction:ltr;
}

.key{
    min-height:43px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    font-family:inherit;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.key:hover{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

.key.special{
    color:var(--primary);
}

.key.clear{
    color:var(--danger);
}

.actions{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-top:16px;
}

.solve-btn{
    min-height:48px;
    border:0;
    border-radius:13px;
    background:var(--primary);
    color:white;
    font-family:inherit;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.solve-btn:hover{
    background:var(--primary-dark);
}

.reset-btn{
    min-height:48px;
    border:1px solid
