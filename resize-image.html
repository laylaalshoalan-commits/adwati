<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغيير حجم الصورة | أدواتي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>تغيير حجم الصورة</h1>
  <p>غيّر أبعاد الصورة بسهولة</p>
</header>

<main>
  <input type="file" id="imageInput" accept="image/*">

  <label for="width">العرض:</label>
  <input type="number" id="width" placeholder="العرض بالبكسل">

  <label for="height">الارتفاع:</label>
  <input type="number" id="height" placeholder="الارتفاع بالبكسل">

  <button onclick="resizeImage()">تغيير الحجم</button>

  <p id="result"></p>

  <a id="download" style="display:none;" download="resized-image.jpg">
    تحميل الصورة
  </a>

  <br><br>
  <a href="index.html">العودة إلى أدواتي</a>
</main>

<script>
function resizeImage() {
  const input = document.getElementById("imageInput");
  const width = parseInt(document.getElementById("width").value);
  const height = parseInt(document.getElementById("height").value);
  const result = document.getElementById("result");
  const download = document.getElementById("download");

  if (!input.files[0]) {
    result.textContent = "يرجى اختيار صورة أولًا";
    return;
  }

  if (!width || !height || width <= 0 || height <= 0) {
    result.textContent = "يرجى إدخال العرض والارتفاع";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    const image = new Image();

    image.onload = function() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(image, 0, 0, width, height);

      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);

        download.href = url;
        download.style.display = "inline-block";
        download.textContent = "تحميل الصورة بالحجم الجديد";

        result.textContent = "تم تغيير حجم الصورة بنجاح";
      }, "image/jpeg", 0.9);
    };

    image.src = event.target.result;
  };

  reader.readAsDataURL(input.files[0]);
}
</script>

</body>
</html>
