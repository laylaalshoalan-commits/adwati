<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة الخصم | أدواتي</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="wrap tool"><div class="box"><a class="logo" href="../index.html">أدواتي</a><h1>حاسبة الخصم</h1><label>السعر</label><input id="p" type="number" value="100"><label>الخصم %</label><input id="d" type="number" value="20"><button onclick="go()">احسب</button><div id="r" class="result"></div></div></main><script>function go(){let s=+p.value,x=+d.value/100;r.innerHTML='قيمة الخصم: <b>'+(s*x).toFixed(2)+'</b><br>السعر النهائي: <b>'+(s-s*x).toFixed(2)+'</b>'}</script></body></html>
