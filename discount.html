<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب الخصم | أدواتي</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>حساب الخصم</h1>
  <p>احسب السعر بعد الخصم بسهولة</p>
</header>

<main>
  <label for="price">السعر الأصلي:</label>
  <input type="number" id="price" placeholder="أدخل السعر">

  <label for="discount">نسبة الخصم %:</label>
  <input type="number" id="discount" placeholder="أدخل نسبة الخصم">

  <button onclick="calculateDiscount()">احسب</button>

  <h2 id="result"></h2>

  <a href="index.html">العودة إلى أدواتي</a>
</main>

<script>
function calculateDiscount() {
  const price = parseFloat(document.getElementById("price").value);
  const discount = parseFloat(document.getElementById("discount").value);
  const result = document.getElementById("result");

  if (isNaN(price) || isNaN(discount)) {
    result.textContent = "يرجى إدخال السعر ونسبة الخصم";
    return;
  }

  const discountValue = price * discount / 100;
  const finalPrice = price - discountValue;

  result.textContent =
    "قيمة الخصم: " + discountValue +
    " — السعر بعد الخصم: " + finalPrice;
}
</script>

</body>
</html>
